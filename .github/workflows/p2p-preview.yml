name: P2P isolated preview
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2p-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      # Public CI uses the same configuration generator and loader as a private build,
      # with pins derived from the checked-in test certificate. No production value.
      - run: gradle -p android -Pp2pAndroidSandbox=true -PcenterConfigFake=true :peer-core:test :app:testP2pPreviewUnitTest :app:assembleP2pPreview :app:assembleStorePreview --stacktrace
      - run: python3 -m pip install -r server/requirements.txt
      - run: python3 scripts/test_p2p_sandbox.py
      - run: python3 scripts/test_p2p_preview_export.py
      - run: python3 scripts/test_center_config_leak.py
      - name: Controlled packaging negative tests (synthetic canary, no production value)
        run: python3 scripts/test_center_config_packaging.py
      - name: Actual TURN relay sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coturn
          turnserver --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 --listening-port=13478 --min-port=49160 --max-port=49180 --use-auth-secret --static-auth-secret=simhub-sandbox-only-never-production-32-bytes --realm=simhub-sandbox --allow-loopback-peers --no-cli --no-tls --no-dtls --no-tcp-relay --log-file=/tmp/simhub-turn.log --pidfile=/tmp/simhub-turn.pid &
          python3 scripts/test_p2p_turn.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simhub-p2p-preview
          path: |
            android/app/build/outputs/apk/p2pPreview/*.apk
            docs/p2p/TEST_GUIDE.zh-CN.md
            p2p-sandbox-results.json

  android-sandbox:
    needs: [preview]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - run: gradle -p android -Pp2pAndroidSandbox=true -PcenterConfigFake=true :app:assembleP2pPreview :app:assembleP2pPreviewAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/p2pPreview/app-p2pPreview.apk
            adb install -r android/app/build/outputs/apk/androidTest/p2pPreview/app-p2pPreview-androidTest.apk
            adb shell cmd role add-role-holder android.app.role.SMS com.blackkcold.simhub.p2ptest
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.READ_SMS
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.RECEIVE_SMS
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.READ_PHONE_STATE
            adb shell am instrument -w -e class com.blackkcold.simhub.p2p.PeerInstrumentedTest com.blackkcold.simhub.p2ptest.test/androidx.test.runner.AndroidJUnitRunner | tee android-sandbox-results.txt
            python3 scripts/export_p2p_preview.py
      - id: tested_apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: simhub-p2p-tested-package
          path: |
            SIMHub-P2P-*-public-preview.apk
            P2P-TEST-GUIDE.md
            android-sandbox-results.txt
            p2p-apk-sha256.txt

      - name: Report verified APK artifact
        if: success()
        env:
          TEST_APK_URL: ${{ steps.tested_apk.outputs.artifact-url }}
        run: |
          {
            echo "## SIM Hub P2P isolated preview: tests passed"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Artifact: [simhub-p2p-tested-package](${TEST_APK_URL})"
            echo "Package includes APK, SHA-256 and Android-runner test evidence."
            echo "Public signaling is retired; the preview build carries the fake test description only."
            echo "Dev experimental preview: real-device and public-network acceptance remain separate release gates."
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22'}
      - run: python3 -m pip install -r modem_agent/requirements.txt -r server/requirements.txt
      - run: PYTHONPATH=server python3 -m unittest -v server.test_v040 server.test_v050 server.test_pairing
      - run: PYTHONPATH=server python3 -m unittest -v server.test_sms_companion_state server.test_device_telemetry server.test_device_location
      - run: PYTHONPATH=server python3 -m unittest -v server.test_passkeys_e2e server.test_hardening server.test_controller_auth server.test_controller_http server.test_global_vault
      - run: PYTHONPATH=server python3 server/test_auth_stages.py
      - run: PYTHONPATH=server python3 -m unittest -v server.test_updates server.test_remote_ota server.test_command_expiry server.test_schema_rollback
      - run: python3 scripts/test_updater.py
      - run: python3 scripts/test_docs.py
      - run: python3 scripts/test_release_notes.py
      - name: Enforce Stable / experimental P2P boundary
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: python3 scripts/check_stable_boundary.py
      - run: python3 scripts/test_stable_boundary.py
      - run: python3 scripts/test_release_pipeline.py
      - run: python3 scripts/test_deployment_bundle.py
      - run: python3 -m unittest -v scripts.test_release_checks scripts.test_apk_release_metadata
      - run: python3 scripts/test_controller_same_phone.py
      - run: python3 scripts/test_icons.py
      - run: python3 server/test_simhub.py
      - run: python3 server/test_surfaces.py
      - run: PYTHONPATH=server python3 server/test_shared_pool.py
      - run: PYTHONPATH=server python3 server/test_migration.py
      - run: PYTHONPATH=server python3 server/test_maintenance.py
      - run: PYTHONPATH=modem_agent python3 modem_agent/test_modem_agent.py
      - run: PYTHONPATH=modem_agent python3 -m unittest -v modem_agent.test_recovery
      - run: node --check web/app.js && node --check web/device-dashboard.js && node --check web/device-location.js && node --check web/i18n.js && node --check web/sw.js
      - run: node web/test_node_dashboard.mjs
      - run: node web/test_device_location.mjs
      - run: node web/test_sms_logic.mjs
      - run: node web/test_service_worker.mjs
      - run: node web/test_crypto_vector.mjs
      - run: node web/test_bootstrap_vector.mjs
      - name: Browser UI regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node web/test_ui.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simhub-ui-screenshots
          path: ui-snapshots/*.png
      - run: python3 -m py_compile server/simhub_server.py server/passkeys.py scripts/setup.py scripts/simhub_updater.py server/update_bridge.py scripts/gen_admin_token.py modem_agent/simhub_modem_agent.py
      - run: bash -n modem_agent/install.sh scripts/install-updater.sh scripts/deploy-verified.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDevRelease -PsimhubDevSequence=1 --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simhub-agent-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-cloud-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIMHUB_ADMIN_TOKEN: simhub-ci-synthetic-administrator-token-not-for-production
      SIMHUB_REQUIRE_TOTP: 'false'
      SIMHUB_BIND: 127.0.0.1
      SIMHUB_PORT: '18443'
      SIMHUB_TRUST_DOCKER_GATEWAY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - run: python3 -m pip install -r server/requirements.txt
      - name: Create ephemeral test-only HTTPS identity
        run: |
          set -eu
          d="$RUNNER_TEMP/simhub-ci"
          mkdir -m 700 "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=SIM Hub CI CA' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$d/ca.key" -out "$d/ca.pem" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' \
            -keyout "$d/relay.key" -out "$d/relay.csr" 2>/dev/null
          printf '%s\n' 'subjectAltName=IP:127.0.0.1' 'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > "$d/leaf.ext"
          openssl x509 -req -in "$d/relay.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" \
            -CAcreateserial -days 1 -extfile "$d/leaf.ext" -out "$d/relay.pem" 2>/dev/null
          mkdir -p android/app/src/cloudAcceptance/res/raw
          cp "$d/ca.pem" android/app/src/cloudAcceptance/res/raw/simhub_ci_ca.pem
      - name: Build isolated emulator app
        run: gradle -p android -PcloudAndroidSandbox=true :app:assembleCloudAcceptance :app:assembleCloudAcceptanceAndroidTest --stacktrace
      - name: Start isolated Relay and enroll synthetic device
        run: |
          export SIMHUB_DB="$RUNNER_TEMP/simhub-ci/relay.db"
          python3 scripts/cloud_android_relay.py serve --cert "$RUNNER_TEMP/simhub-ci/relay.pem" \
            --key "$RUNNER_TEMP/simhub-ci/relay.key" > "$RUNNER_TEMP/simhub-ci/relay.log" 2>&1 &
          python3 scripts/cloud_android_relay.py enroll --ca "$RUNNER_TEMP/simhub-ci/ca.pem" \
            --output "$RUNNER_TEMP/simhub-ci/enrollment.json"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/run_cloud_android_acceptance.sh

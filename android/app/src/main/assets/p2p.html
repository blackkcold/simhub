<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; connect-src 'none'"><script>
'use strict';
let pc,dc,epoch=0,lastInit,ready=false,relayAllowed=false,assembling=new Map(),candidateQueue=[];
const native=(type,data={})=>PeerBridge.postMessage(JSON.stringify({type,...data}));
const MAX=600000,CHUNK=16000;
function attach(channel){
 dc=channel;const own=epoch;dc.onopen=()=>{if(own!==epoch)return;ready=false;route();};dc.onclose=()=>{if(own!==epoch)return;ready=false;native('closed')};dc.onerror=()=>{if(own===epoch)native('error',{reason:'channel_error'})};
 dc.onmessage=e=>{if(own!==epoch||!ready)return;try{const f=JSON.parse(e.data);if(typeof f.id!=='string'||f.id.length>80||!Number.isInteger(f.n)||f.n<1||f.n>40||!Number.isInteger(f.i)||f.i<0||f.i>=f.n||typeof f.d!=='string'||f.d.length>CHUNK)throw Error();
   if(!assembling.has(f.id)){if(assembling.size>=8)throw Error();const timer=setTimeout(()=>assembling.delete(f.id),15000);assembling.set(f.id,{pieces:new Array(f.n),timer});}
   const a=assembling.get(f.id);if(a.pieces.length!==f.n||a.pieces[f.i]!==undefined)throw Error();a.pieces[f.i]=f.d;
   if(Array.from(a.pieces).every(x=>typeof x==='string')){const frame=a.pieces.join('');clearTimeout(a.timer);assembling.delete(f.id);if(frame.length>MAX)throw Error();native('data',{frame});}
 }catch(_){native('error',{reason:'rtc_command_failed'});}};
}
async function route(attempt=0){
 const connection=pc,channel=dc,own=epoch;if(!connection||channel?.readyState!=='open'||connection.connectionState!=='connected')return;
 const stats=await connection.getStats();if(pc!==connection||own!==epoch||channel.readyState!=='open')return;
 let pair;for(const s of stats.values())if(s.type==='transport'&&s.selectedCandidatePairId)pair=stats.get(s.selectedCandidatePairId);
 if(!pair)for(const s of stats.values())if(s.type==='candidate-pair'&&s.state==='succeeded'&&s.nominated)pair=s;
 const local=pair&&stats.get(pair.localCandidateId),remote=pair&&stats.get(pair.remoteCandidateId);
 if(!pair||!local||!remote){
   if(attempt<20)setTimeout(()=>{if(pc===connection&&epoch===own)route(attempt+1)},100);
   else{ready=false;channel.close();connection.close();native('error',{reason:'route_unconfirmed'});}return;
 }
 // Host-to-host on private addresses is a LAN path. Other non-relay ICE
 // candidates prove peer-to-peer, but not necessarily a cross-internet path.
 const privateHost=c=>{const address=String(c?.address||c?.ip||'').toLowerCase();const v4=address.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);return v4?Number(v4[1])===10||(Number(v4[1])===172&&Number(v4[2])>=16&&Number(v4[2])<=31)||(Number(v4[1])===192&&Number(v4[2])===168)||Number(v4[1])===169&&Number(v4[2])===254:/^(fe80:|fc[0-9a-f]{2}:|fd[0-9a-f]{2}:)/.test(address)};
 const transport=local.candidateType==='relay'||remote.candidateType==='relay'?'TURN':local.candidateType==='host'&&remote.candidateType==='host'&&privateHost(local)&&privateHost(remote)?'LAN':'DIRECT';
 if(transport==='TURN'&&!relayAllowed){ready=false;channel.close();connection.close();native('error',{reason:'turn_not_allowed'});return;}
 const changed=!ready;ready=true;if(changed)native('connected',{route:transport});
}
async function command(c){try{
 if(c.type==='init'){
   epoch++;lastInit={...c};if(pc)pc.close();for(const a of assembling.values())clearTimeout(a.timer);assembling.clear();candidateQueue=[];ready=false;relayAllowed=!!c.fallback;const servers=c.servers.filter(s=>Array.isArray(s.urls)&&s.urls.every(u=>typeof u==='string'&&(/^(stun|stuns):/.test(u)||(c.fallback&&/^(turn|turns):/.test(u)))));
   pc=new RTCPeerConnection({iceServers:servers,iceTransportPolicy:'all'});
   const own=epoch,connection=pc;pc.onicecandidate=e=>{if(own===epoch&&e.candidate)native('signal',{payload:{candidate:e.candidate.toJSON()}})};
   pc.ondatachannel=e=>{if(own===epoch)attach(e.channel)};pc.onconnectionstatechange=()=>{if(pc!==connection||own!==epoch)return;if(pc.connectionState==='connected'&&dc?.readyState==='open')route();if(pc.connectionState==='disconnected'||pc.connectionState==='failed'||pc.connectionState==='closed'){ready=false;native('closed')}};
   if(c.initiator){attach(pc.createDataChannel('simhub-peer-v1',{ordered:true}));await pc.setLocalDescription(await pc.createOffer());native('signal',{payload:{description:pc.localDescription.toJSON()}});}return;
 }
 if(c.type==='signal'){
   const s=c.payload;if((!pc||pc.signalingState==='closed'||dc?.readyState==='closed')&&lastInit)await command({...lastInit,initiator:false});
   if(!relayAllowed&&s.candidate&&/(?:^| )typ relay(?: |$)/.test(s.candidate.candidate||''))return;
   if(!relayAllowed&&s.description?.sdp)s.description.sdp=s.description.sdp.split('\r\n').filter(line=>!/^a=candidate:.*(?:^| )typ relay(?: |$)/.test(line)).join('\r\n');
   if(s.description){await pc.setRemoteDescription(s.description);for(const candidate of candidateQueue)await pc.addIceCandidate(candidate);candidateQueue=[];if(s.description.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());native('signal',{payload:{description:pc.localDescription.toJSON()}});}}
   if(s.candidate){if(pc.remoteDescription)await pc.addIceCandidate(s.candidate);else if(candidateQueue.length<128)candidateQueue.push(s.candidate);}return;
 }
 if(c.type==='restart'){if((!pc||pc.signalingState==='closed'||dc?.readyState==='closed')&&lastInit)return command(lastInit);ready=false;pc.restartIce();await pc.setLocalDescription(await pc.createOffer({iceRestart:true}));native('signal',{payload:{description:pc.localDescription.toJSON()}});return;}
 if(c.type==='send'){
   if(!ready||typeof c.frame!=='string'||c.frame.length>MAX||dc.bufferedAmount>2000000)throw Error();const id=JSON.parse(c.frame).id,n=Math.ceil(c.frame.length/CHUNK);for(let i=0;i<n;i++)dc.send(JSON.stringify({id,i,n,d:c.frame.slice(i*CHUNK,(i+1)*CHUNK)}));return;
 }
 if(c.type==='close'){dc?.close();pc?.close();ready=false;for(const a of assembling.values())clearTimeout(a.timer);assembling.clear();}
 }catch(_){native('error',{reason:'rtc_command_failed'});}}
// The trusted Android host answers via the origin-scoped PeerBridge object.
// Do not accept global window message events from untrusted frames or origins.
PeerBridge.onmessage=event=>{try{
 if(typeof event.data!=='string'||event.data.length>MAX)return;
 const cmd=JSON.parse(event.data);
 if(!cmd||typeof cmd!=='object'||typeof cmd.type!=='string')return;
 void command(cmd);
}catch(_){native('error',{reason:'native_command_invalid'});}};
window.peerCommand=command;native('loaded');
</script>

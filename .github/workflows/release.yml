name: Publish signed release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release/v0.14.1.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            git fetch origin main:refs/remotes/origin/main --no-tags
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Release tag must point to main history"
              exit 1
            }
          else
            test "$GITHUB_REF_NAME" = "main"
            VERSION="$(head -n1 .github/release/v0.14.1.trigger | tr -d '[:space:]')"
            TAG="v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release version: $VERSION"
            exit 1
          }
          ANDROID_VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          SERVER_VERSION=$(python3 - <<'PY'
          import re
          text=open("server/simhub_server.py",encoding="utf-8").read()
          m=re.search(r'^APP_VERSION = "([^"]+)"',text,re.M)
          print(m.group(1) if m else "")
          PY
          )
          test -n "$ANDROID_VERSION"
          test "$VERSION" = "$ANDROID_VERSION" || {
            echo "::error::Tag/trigger version $VERSION != Android $ANDROID_VERSION"
            exit 1
          }
          test "$VERSION" = "$SERVER_VERSION" || {
            echo "::error::Tag/trigger version $VERSION != Relay $SERVER_VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python3 -m pip install -r modem_agent/requirements.txt -r server/requirements.txt
      - run: PYTHONPATH=server python3 -m unittest -v server.test_v040 server.test_v050
      - run: PYTHONPATH=server python3 -m unittest -v server.test_sms_companion_state
      - run: PYTHONPATH=server python3 -m unittest -v server.test_passkeys_e2e server.test_hardening
      - run: PYTHONPATH=server python3 server/test_auth_stages.py
      - run: PYTHONPATH=server python3 -m unittest -v server.test_updates server.test_remote_ota
      - run: python3 scripts/test_updater.py
      - run: python3 scripts/test_docs.py
      - run: python3 scripts/test_icons.py
      - run: python3 server/test_simhub.py
      - run: python3 server/test_surfaces.py
      - run: PYTHONPATH=server python3 server/test_shared_pool.py
      - run: PYTHONPATH=server python3 server/test_migration.py
      - run: PYTHONPATH=server python3 server/test_maintenance.py
      - run: PYTHONPATH=modem_agent python3 modem_agent/test_modem_agent.py
      - run: node --check web/app.js && node --check web/i18n.js && node --check web/sw.js
      - run: node web/test_sms_logic.mjs
      - run: node web/test_crypto_vector.mjs
      - run: node web/test_bootstrap_vector.mjs
      - run: python3 -m py_compile server/simhub_server.py server/passkeys.py scripts/setup.py scripts/gen_admin_token.py scripts/gen_totp_secret.py modem_agent/simhub_modem_agent.py
      - run: bash -n modem_agent/install.sh scripts/install-updater.sh

  build-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push prebuilt relay image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/blackkcold/simhub-relay:v${{ needs.validate.outputs.version }}
          provenance: true
          platforms: linux/amd64,linux/arm64
      - uses: sigstore/cosign-installer@v3.9.0
      - name: Sign and verify immutable OCI digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/blackkcold/simhub-relay@$IMAGE_DIGEST"
          cosign sign --yes "$IMAGE"
          cosign verify \
            --certificate-identity="https://github.com/blackkcold/simhub/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE"

  sign:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check required signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.0'

      - name: Decode keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/simhub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$ANDROID_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify signing certificate
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-report.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest:' signing-report.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          EXPECTED='633f600f7ec0ac5cdcdcffb536ade4beec8312cc083487a225c8c308771fd8d3'
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Unexpected signing certificate digest: $ACTUAL"
            exit 1
          fi
          cp "$APK" "simhub-agent-v${VERSION}-release.apk"
          sha256sum "simhub-agent-v${VERSION}-release.apk" > "simhub-agent-v${VERSION}-release.apk.sha256"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-apk
          path: |
            simhub-agent-v*-release.apk
            simhub-agent-v*-release.apk.sha256
            signing-report.txt
          if-no-files-found: error

  publish:
    needs: [validate, sign, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apk
          path: release

      - name: Create immutable release tag after successful signing
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          EXISTING=$(git rev-parse -q --verify "$TAG^{commit}" 2>/dev/null || true)
          if [[ -n "$EXISTING" && "$EXISTING" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag already exists at a different commit; refusing replacement"
            exit 1
          fi
          if [[ -z "$EXISTING" ]]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Assemble release assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          mkdir -p release/docs
          git archive --format=zip --output="release/simhub-v${VERSION}-source.zip" HEAD
          cp README.md README.zh-CN.md CHANGELOG.md SECURITY.md THREAT_MODEL.md THIRD_PARTY_NOTICES.md LICENSE release/docs/
          cp docs/*.md release/docs/
          cp modem_agent/README.md release/docs/MODEM_AGENT.md
          (cd release/docs && zip -q -r "../simhub-v${VERSION}-docs.zip" .)
          sha256sum "release/simhub-agent-v${VERSION}-release.apk" \
            "release/simhub-v${VERSION}-source.zip" \
            "release/simhub-v${VERSION}-docs.zip" > release/SHA256SUMS.txt
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\)/\1/p' android/app/build.gradle.kts | head -1)"
          export VERSION VERSION_CODE
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          version=os.environ["VERSION"]
          root=pathlib.Path("release")
          def digest(filename):
              return hashlib.sha256((root/filename).read_bytes()).hexdigest()
          apk=f"simhub-agent-v{version}-release.apk"
          source=f"simhub-v{version}-source.zip"
          import re
          schema=re.search(r"PRAGMA user_version=([0-9]+)",pathlib.Path("server/simhub_server.py").read_text())
          if not schema:raise SystemExit("Missing relay database schema declaration")
          db_schema=int(schema.group(1))
          data={
              "schemaVersion":1,"release":version,"channel":"stable",
              "notes":"Unified Android node/controller Compose shell and QR-based trusted HTTPS management setup",
              "server":{"version":version,"image":"ghcr.io/blackkcold/simhub-relay@"+os.environ["IMAGE_DIGEST"],"asset":source,"sha256":digest(source),"dbSchema":db_schema},
              "android":{"versionName":version,"versionCode":int(os.environ["VERSION_CODE"]),
                         "asset":apk,"sha256":digest(apk),
                         "packageName":"com.blackkcold.simhub"},
              "minimumCompatibleServer":"0.9.0",
              "minimumCompatibleAndroid":"0.9.0"
          }
          (root/"update-manifest.json").write_text(json.dumps(data,indent=2)+chr(10),encoding="utf-8")
          PY


      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release/RELEASE_NOTES.md <<EOF
          # SIM Hub v${VERSION}

          SIM Hub v0.13.3 adds opt-in remote signed APK updates on Android 16+, with developer-only eligibility override for testing older versions.

          ## Highlights
          - Remote controller-initiated Android self-updates require explicit local opt-in and administrator step-up.
          - Android 16+ gating; developer override below Android 16 never bypasses installer permissions or confirmation.
          - Track download, verification, installation, confirmation and verified post-replacement recovery states.
          - Enforce original APK signature, release metadata and SHA-256; never install third-party packages.
          - Restore enabled relay/job transport using ACTION_MY_PACKAGE_REPLACED without forcing a background Activity.
          - Default to Wi-Fi downloads and pause on battery under 25% unless charging; cancellation before installer commit.
          - Persist SMS Provider change generations, catch same-second updates and late Provider writes.
          - Encrypt and queue new SMS before Relay network checks, even during retry backoff.
          - Decouple remote command retrieval from 15-minute maintenance; Balanced command checks use ~45s interactive and ~120s idle cadences with best-effort background recovery.
          - Expose actual foreground listener health, command-check times/errors and a manual check-and-sync action.
          - Expire stale controller commands even if their device never polls again.
          - Replace narrow three-way chips with full-width accessible power cards and icon assets.
          - Preserve v0.13.0 encrypted storage, queue idempotency, v0.12.2 unpair recovery and pairing-independent APK updates.

          ## Platform limits
          Doze and OEM restrictions may delay background jobs. Configured FCM/push delivery
          is not bundled. No Android OTP protection is bypassed; confirm real-device
          receive latency and background survival independently from CI.

          ## Host activation
          After migrating the Docker engine to rootless mode, run \`bash scripts/install-updater.sh\`
          on the Docker host to enable one-click future upgrades from Web settings.
          Android may still ask for system installation permission or confirmation.

          Full details are in CHANGELOG.md and the documentation bundle.
          EOF
          ASSETS=(
            "release/simhub-agent-v${VERSION}-release.apk"
            "release/simhub-agent-v${VERSION}-release.apk.sha256"
            "release/simhub-v${VERSION}-source.zip"
            "release/simhub-v${VERSION}-docs.zip"
            "release/signing-report.txt"
            "release/SHA256SUMS.txt"
            "release/update-manifest.json"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG is already published; leaving immutable assets unchanged"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "SIM Hub v${VERSION}" --notes-file release/RELEASE_NOTES.md "${ASSETS[@]}"

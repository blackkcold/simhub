name: P2P isolated preview
on:
  push:
    branches: [feature/p2p-isolated-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2p-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - run: gradle -p android :app:testP2pPreviewUnitTest :app:assembleP2pPreview --stacktrace
      - run: python3 -m pip install -r server/requirements.txt
      - run: python3 scripts/test_p2p_sandbox.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simhub-p2p-preview
          path: |
            android/app/build/outputs/apk/p2pPreview/*.apk
            docs/p2p/TEST_GUIDE.zh-CN.md
            p2p-sandbox-results.json

  android-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - run: gradle -p android :app:assembleP2pPreview :app:assembleP2pPreviewAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/p2pPreview/app-p2pPreview.apk
            adb install -r android/app/build/outputs/apk/androidTest/p2pPreview/app-p2pPreview-androidTest.apk
            adb shell cmd role add-role-holder android.app.role.SMS com.blackkcold.simhub.p2ptest
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.READ_SMS
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.RECEIVE_SMS
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.READ_PHONE_STATE
            adb shell am instrument -w -e class com.blackkcold.simhub.p2p.PeerInstrumentedTest com.blackkcold.simhub.p2ptest.test/android.test.InstrumentationTestRunner | tee android-sandbox-results.txt
            grep -q 'OK (4 tests)' android-sandbox-results.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simhub-p2p-android-sandbox
          path: android-sandbox-results.txt

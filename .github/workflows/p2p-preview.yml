name: P2P isolated preview
on:
  push:
    branches: [feature/p2p-isolated-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2p-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - run: gradle -p android -Pp2pAndroidSandbox=true :app:testP2pPreviewUnitTest :app:assembleP2pPreview :app:assembleStorePreview --stacktrace
      - run: python3 -m pip install -r server/requirements.txt
      - run: python3 scripts/test_p2p_sandbox.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/test_p2p_webrtc.mjs
      - name: Actual TURN relay sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coturn
          turnserver --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 --listening-port=13478 --min-port=49160 --max-port=49180 --use-auth-secret --static-auth-secret=sandbox-only-never-production --realm=simhub-sandbox --allow-loopback-peers --no-cli --no-tls --no-dtls --no-tcp-relay --log-file=/tmp/simhub-turn.log --pidfile=/tmp/simhub-turn.pid &
          python3 scripts/test_p2p_turn.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simhub-p2p-preview
          path: |
            android/app/build/outputs/apk/p2pPreview/*.apk
            docs/p2p/TEST_GUIDE.zh-CN.md
            p2p-sandbox-results.json

  public-p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        role: [node, controller]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Independent runners, public encrypted signaling, STUN-only DIRECT
        env:
          P2P_PUBLIC_ROLE: ${{ matrix.role }}
          P2P_PUBLIC_SESSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/test_p2p_public.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simhub-public-p2p-${{ matrix.role }}
          path: p2p-public-${{ matrix.role }}.json

  android-sandbox:
    needs: public-p2p
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - run: gradle -p android -Pp2pAndroidSandbox=true :app:assembleP2pPreview :app:assembleP2pPreviewAndroidTest --stacktrace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: simhub-public-p2p-*
          path: public-evidence
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/p2pPreview/app-p2pPreview.apk
            adb install -r android/app/build/outputs/apk/androidTest/p2pPreview/app-p2pPreview-androidTest.apk
            adb shell cmd role add-role-holder android.app.role.SMS com.blackkcold.simhub.p2ptest
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.READ_SMS
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.RECEIVE_SMS
            adb shell pm grant com.blackkcold.simhub.p2ptest android.permission.READ_PHONE_STATE
            adb shell am instrument -w -e class com.blackkcold.simhub.p2p.PeerInstrumentedTest com.blackkcold.simhub.p2ptest.test/androidx.test.runner.AndroidJUnitRunner | tee android-sandbox-results.txt
            grep -q 'OK (12 tests)' android-sandbox-results.txt
            cp android/app/build/outputs/apk/p2pPreview/app-p2pPreview.apk SIMHub-P2P-0.17.1-public-preview.apk
            cp docs/p2p/TEST_GUIDE.zh-CN.md P2P-TEST-GUIDE.md
            sha256sum SIMHub-P2P-0.17.1-public-preview.apk > p2p-apk-sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simhub-p2p-tested-package
          path: |
            SIMHub-P2P-0.17.1-public-preview.apk
            P2P-TEST-GUIDE.md
            android-sandbox-results.txt
            p2p-apk-sha256.txt
            public-evidence/*.json

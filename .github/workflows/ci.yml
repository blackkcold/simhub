name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python3 -m pip install -r modem_agent/requirements.txt
      - run: python3 server/test_simhub.py
      - run: PYTHONPATH=server python3 server/test_migration.py
      - run: PYTHONPATH=server python3 server/test_maintenance.py
      - run: PYTHONPATH=modem_agent python3 modem_agent/test_modem_agent.py
      - run: node --check web/app.js && node --check web/sw.js
      - run: python3 -m py_compile server/simhub_server.py scripts/gen_admin_token.py modem_agent/simhub_modem_agent.py
      - run: bash -n modem_agent/install.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: simhub-agent-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

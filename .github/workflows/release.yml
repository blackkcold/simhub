name: Publish signed release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - '.github/release/v0.5.3.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            git fetch origin main:refs/remotes/origin/main --no-tags
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Release tag must point to main history"
              exit 1
            }
          else
            test "$GITHUB_REF_NAME" = "main"
            VERSION="$(head -n1 .github/release/v0.5.3.trigger | tr -d '[:space:]')"
            TAG="v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release version: $VERSION"
            exit 1
          }
          ANDROID_VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          SERVER_VERSION=$(python3 - <<'PY'
          import re
          text=open("server/simhub_server.py",encoding="utf-8").read()
          m=re.search(r'^APP_VERSION = "([^"]+)"',text,re.M)
          print(m.group(1) if m else "")
          PY
          )
          test -n "$ANDROID_VERSION"
          test "$VERSION" = "$ANDROID_VERSION" || {
            echo "::error::Tag/trigger version $VERSION != Android $ANDROID_VERSION"
            exit 1
          }
          test "$VERSION" = "$SERVER_VERSION" || {
            echo "::error::Tag/trigger version $VERSION != Relay $SERVER_VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r modem_agent/requirements.txt -r server/requirements.txt
      - run: PYTHONPATH=server python3 -m unittest -v server.test_v040 server.test_v050
      - run: PYTHONPATH=server python3 -m unittest -v server.test_passkeys_e2e server.test_hardening
      - run: python3 scripts/test_docs.py
      - run: python3 server/test_simhub.py
      - run: python3 server/test_surfaces.py
      - run: PYTHONPATH=server python3 server/test_migration.py
      - run: PYTHONPATH=server python3 server/test_maintenance.py
      - run: PYTHONPATH=modem_agent python3 modem_agent/test_modem_agent.py
      - run: node --check web/app.js && node --check web/i18n.js && node --check web/sw.js
      - run: node web/test_crypto_vector.mjs
      - run: node web/test_bootstrap_vector.mjs
      - run: python3 -m py_compile server/simhub_server.py server/passkeys.py scripts/setup.py scripts/gen_admin_token.py scripts/gen_totp_secret.py modem_agent/simhub_modem_agent.py
      - run: bash -n modem_agent/install.sh

  sign:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check required signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.0'

      - name: Decode keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/simhub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$ANDROID_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify signing certificate
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-report.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest:' signing-report.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          EXPECTED='633f600f7ec0ac5cdcdcffb536ade4beec8312cc083487a225c8c308771fd8d3'
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Unexpected signing certificate digest: $ACTUAL"
            exit 1
          fi
          cp "$APK" "simhub-agent-v${VERSION}-release.apk"
          sha256sum "simhub-agent-v${VERSION}-release.apk" > "simhub-agent-v${VERSION}-release.apk.sha256"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apk
          path: |
            simhub-agent-v*-release.apk
            simhub-agent-v*-release.apk.sha256
            signing-report.txt
          if-no-files-found: error

  publish:
    needs: [validate, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apk
          path: release

      - name: Reconcile release tag after successful signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force 2>/dev/null || true
          EXISTING=$(git rev-parse -q --verify "$TAG^{commit}" 2>/dev/null || true)
          if [[ -n "$EXISTING" && "$EXISTING" != "$GITHUB_SHA" ]]; then
            echo "Replacing $TAG from $EXISTING with final release commit $GITHUB_SHA"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            else
              git push origin ":refs/tags/$TAG" || true
            fi
            git tag -d "$TAG" >/dev/null 2>&1 || true
            EXISTING=""
          fi
          if [[ -z "$EXISTING" ]]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Assemble release assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/docs
          git archive --format=zip --output="release/simhub-v${VERSION}-source.zip" HEAD
          cp README.md README.zh-CN.md CHANGELOG.md SECURITY.md THREAT_MODEL.md THIRD_PARTY_NOTICES.md LICENSE release/docs/
          cp docs/*.md release/docs/
          cp modem_agent/README.md release/docs/MODEM_AGENT.md
          (cd release/docs && zip -q -r "../simhub-v${VERSION}-docs.zip" .)
          sha256sum             "release/simhub-agent-v${VERSION}-release.apk"             "release/simhub-v${VERSION}-source.zip"             "release/simhub-v${VERSION}-docs.zip"             > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release/RELEASE_NOTES.md <<EOF
          # SIM Hub v${VERSION}

          Vault redaction, safer pairing, reliable SMS history and device status improvements.

          ## Highlights
          - Purge decrypted SMS, one-time enrollment credentials, SIM numbers, drafts and diagnostics from the browser DOM on Vault lock; synchronize locking between tabs;
          - Require explicit Android relay-domain confirmation and prevent interceptable custom-scheme credential dispatch;
          - Persist encrypted SMS upload receipts on Android, expose scanned vs newly queued counts, and display recent device-command results;
          - Preserve Vault-wrapped retired Node Keys for existing encrypted SMS after future rotations, without exposing plaintext to Relay;
          - Segment authentication/API/static rate budgets and expand CodeQL coverage to Android Java;
          - Preserve existing encrypted data, sessions, device enrollments and signing identity.

          Full details are in CHANGELOG.md and the documentation bundle.
          EOF
          ASSETS=(
            "release/simhub-agent-v${VERSION}-release.apk"
            "release/simhub-agent-v${VERSION}-release.apk.sha256"
            "release/simhub-v${VERSION}-source.zip"
            "release/simhub-v${VERSION}-docs.zip"
            "release/signing-report.txt"
            "release/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "SIM Hub v${VERSION}" --notes-file release/RELEASE_NOTES.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "SIM Hub v${VERSION}" --notes-file release/RELEASE_NOTES.md "${ASSETS[@]}"
          fi

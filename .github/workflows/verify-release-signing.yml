name: Verify Android release signing

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to verify (branch, tag, or SHA)'
        required: true
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.0'

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/simhub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$ANDROID_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify APK signature and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-report.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest:' signing-report.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          EXPECTED='633f600f7ec0ac5cdcdcffb536ade4beec8312cc083487a225c8c308771fd8d3'
          test "$ACTUAL" = "$EXPECTED"
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          cp "$APK" "simhub-agent-v${VERSION}-release.apk"
          sha256sum "simhub-agent-v${VERSION}-release.apk" > "simhub-agent-v${VERSION}-release.apk.sha256"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simhub-release-signed
          path: |
            simhub-agent-v*-release.apk
            simhub-agent-v*-release.apk.sha256
            signing-report.txt

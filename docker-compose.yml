services:
  simhub:
    image: ${SIMHUB_IMAGE_REF:-simhub-relay:${SIMHUB_IMAGE_TAG:-local}}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SIMHUB_TRUST_DOCKER_GATEWAY: "true"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    volumes:
      - simhub-data:/data
      - ./.simhub-updater:/run/simhub-updater:ro
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  simhub-data:

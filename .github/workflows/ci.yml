name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest can move to an unsupported release.
  server-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22'}
      - run: python3 -m pip install -r modem_agent/requirements.txt -r server/requirements.txt
      - name: Discover all Python and Web regression entry points
        run: python3 scripts/run_regressions.py
      - name: Enforce Stable / experimental P2P boundary
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: python3 scripts/check_stable_boundary.py
      - name: Browser UI regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node web/test_ui.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simhub-ui-screenshots
          path: ui-snapshots/*.png
      - run: python3 -m py_compile server/simhub_server.py server/passkeys.py scripts/setup.py scripts/simhub_updater.py server/update_bridge.py scripts/gen_admin_token.py modem_agent/simhub_modem_agent.py
      - run: bash -n modem_agent/install.sh scripts/install-updater.sh scripts/deploy-verified.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
      - run: gradle -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDevRelease -PsimhubDevSequence=1 --stacktrace
      - name: Print complete Android lint diagnostics
        if: always()
        run: |
          report=android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Retain Android lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simhub-android-lint
          if-no-files-found: ignore
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
      - name: Verify actual APK package and version metadata
        shell: bash
        run: |
          set -euo pipefail
          stable_apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          dev_apk="$(find android/app/build/outputs/apk/devRelease -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$stable_apk" && test -n "$dev_apk"
          version="$(sed -n 's/.*versionName = "\([0-9.]*\)".*/\1/p' android/app/build.gradle.kts | head -1)"
          test -n "$version"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          python3 scripts/apk_release_metadata.py inspect --aapt "$aapt" --apk "$stable_apk" \
            --metadata "$RUNNER_TEMP/stable-apk.json" --channel stable --version "$version"
          python3 scripts/apk_release_metadata.py inspect --aapt "$aapt" --apk "$dev_apk" \
            --metadata "$RUNNER_TEMP/dev-apk.json" --channel dev --version "${version}-dev.1"
          python3 - <<'PYCODE'
          import json, os, pathlib, re
          text=pathlib.Path("android/app/build.gradle.kts").read_text()
          base=int(re.search(r"versionCode\s*=\s*([0-9]+)",text).group(1))
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          stable=json.loads((temp/"stable-apk.json").read_text())
          dev=json.loads((temp/"dev-apk.json").read_text())
          if stable["versionCode"]!=base or dev["versionCode"]!=base*100000+1:
              raise SystemExit("Actual APK version codes do not match the channel contract")
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simhub-agent-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-min-api:
    name: android-min-api (${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.blackkcold.simhub.NodeRecoveryInstrumentedTest --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: simhub-min-api-${{ matrix.api }}-results
          path: android/app/build/outputs/androidTest-results/connected/

  android-cloud-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIMHUB_ADMIN_TOKEN: simhub-ci-synthetic-administrator-token-not-for-production
      SIMHUB_REQUIRE_TOTP: 'false'
      SIMHUB_BIND: 127.0.0.1
      SIMHUB_PORT: '18443'
      SIMHUB_TRUST_DOCKER_GATEWAY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: 'platform-tools'}
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: {gradle-version: '9.6.0'}
      - run: python3 -m pip install -r server/requirements.txt
      - name: Create ephemeral test-only HTTPS identity
        run: |
          set -eu
          d="$RUNNER_TEMP/simhub-ci"
          mkdir -m 700 "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=SIM Hub CI CA' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$d/ca.key" -out "$d/ca.pem" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' \
            -keyout "$d/relay.key" -out "$d/relay.csr" 2>/dev/null
          printf '%s\n' 'subjectAltName=IP:127.0.0.1' 'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > "$d/leaf.ext"
          openssl x509 -req -in "$d/relay.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" \
            -CAcreateserial -days 1 -extfile "$d/leaf.ext" -out "$d/relay.pem" 2>/dev/null
          mkdir -p android/app/src/cloudAcceptance/res/raw
          cp "$d/ca.pem" android/app/src/cloudAcceptance/res/raw/simhub_ci_ca.pem
      - name: Build isolated emulator app
        run: gradle -p android -PcloudAndroidSandbox=true :app:assembleCloudAcceptance :app:assembleCloudAcceptanceAndroidTest --stacktrace
      - name: Start isolated Relay and enroll synthetic device
        run: |
          export SIMHUB_DB="$RUNNER_TEMP/simhub-ci/relay.db"
          python3 scripts/cloud_android_relay.py serve --cert "$RUNNER_TEMP/simhub-ci/relay.pem" \
            --key "$RUNNER_TEMP/simhub-ci/relay.key" > "$RUNNER_TEMP/simhub-ci/relay.log" 2>&1 &
          python3 scripts/cloud_android_relay.py enroll --ca "$RUNNER_TEMP/simhub-ci/ca.pem" \
            --output "$RUNNER_TEMP/simhub-ci/enrollment.json"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/run_cloud_android_acceptance.sh
      - name: Show isolated Relay diagnostics on failure
        if: failure()
        run: tail -n 160 "$RUNNER_TEMP/simhub-ci/relay.log" || true

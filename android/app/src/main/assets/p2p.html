<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; connect-src 'none'"><script>
'use strict';
let pc,dc,ready=false,assembling=new Map(),candidateQueue=[];
const native=(type,data={})=>PeerBridge.postMessage(JSON.stringify({type,...data}));
const MAX=600000,CHUNK=16000;
function attach(channel){
 dc=channel;dc.onopen=()=>{ready=true;route();};dc.onclose=()=>{ready=false;native('closed')};dc.onerror=()=>native('error');
 dc.onmessage=e=>{try{const f=JSON.parse(e.data);if(typeof f.id!=='string'||f.id.length>80||!Number.isInteger(f.n)||f.n<1||f.n>40||!Number.isInteger(f.i)||f.i<0||f.i>=f.n||typeof f.d!=='string'||f.d.length>CHUNK)throw Error();
   if(!assembling.has(f.id)){if(assembling.size>=8)throw Error();const timer=setTimeout(()=>assembling.delete(f.id),15000);assembling.set(f.id,{pieces:new Array(f.n),timer});}
   const a=assembling.get(f.id);if(a.pieces.length!==f.n||a.pieces[f.i]!==undefined)throw Error();a.pieces[f.i]=f.d;
   if(Array.from(a.pieces).every(x=>typeof x==='string')){const frame=a.pieces.join('');clearTimeout(a.timer);assembling.delete(f.id);if(frame.length>MAX)throw Error();native('data',{frame});}
 }catch(_){native('error');}};
}
async function route(){
 const stats=await pc.getStats();let transport='DIRECT';for(const s of stats.values()){if(s.type==='candidate-pair'&&s.state==='succeeded'&&s.nominated){const local=stats.get(s.localCandidateId),remote=stats.get(s.remoteCandidateId);if(local?.candidateType==='relay'||remote?.candidateType==='relay')transport='TURN';}}
 native('connected',{route:transport});
}
async function command(c){try{
 if(c.type==='init'){
   if(pc)pc.close();candidateQueue=[];ready=false;const servers=c.servers.filter(s=>Array.isArray(s.urls)&&s.urls.every(u=>typeof u==='string'&&(/^(stun|stuns):/.test(u)||(c.fallback&&/^(turn|turns):/.test(u)))));
   pc=new RTCPeerConnection({iceServers:servers,iceTransportPolicy:'all'});
   pc.onicecandidate=e=>{if(e.candidate)native('signal',{payload:{candidate:e.candidate.toJSON()}})};
   pc.ondatachannel=e=>attach(e.channel);pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')native('closed')};
   if(c.initiator){attach(pc.createDataChannel('simhub-peer-v1',{ordered:true}));await pc.setLocalDescription(await pc.createOffer());native('signal',{payload:{description:pc.localDescription.toJSON()}});}return;
 }
 if(c.type==='signal'){
   const s=c.payload;if(s.description){await pc.setRemoteDescription(s.description);for(const candidate of candidateQueue)await pc.addIceCandidate(candidate);candidateQueue=[];if(s.description.type==='offer'){await pc.setLocalDescription(await pc.createAnswer());native('signal',{payload:{description:pc.localDescription.toJSON()}});}}
   if(s.candidate){if(pc.remoteDescription)await pc.addIceCandidate(s.candidate);else if(candidateQueue.length<128)candidateQueue.push(s.candidate);}return;
 }
 if(c.type==='send'){
   if(!ready||typeof c.frame!=='string'||c.frame.length>MAX||dc.bufferedAmount>2000000)throw Error();const id=JSON.parse(c.frame).id,n=Math.ceil(c.frame.length/CHUNK);for(let i=0;i<n;i++)dc.send(JSON.stringify({id,i,n,d:c.frame.slice(i*CHUNK,(i+1)*CHUNK)}));return;
 }
 if(c.type==='close'){dc?.close();pc?.close();ready=false;for(const a of assembling.values())clearTimeout(a.timer);assembling.clear();}
 }catch(_){native('error');}}
window.peerCommand=command;native('loaded');
</script>

name: Remote OTA pre-release checks

on:
  push:
    branches:
      - feat/android-16-remote-ota-20261010
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  relay-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python3 -m pip install -r server/requirements.txt
      - run: PYTHONPATH=server python3 -m unittest -v server.test_remote_ota server.test_updates server.test_hardening
      - run: node --check web/app.js && node --check web/i18n.js
      - run: node web/test_ui.mjs
      - run: python3 -m py_compile server/simhub_server.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.0'
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --stacktrace

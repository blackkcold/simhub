name: Verify Android release signing

on:
  workflow_dispatch:
    inputs:
      publish_to_release:
        description: 'Upload signed APK to v0.1.5 release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          ref: v0.1.5
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/simhub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$ANDROID_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Verify APK signature and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-report.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest:' signing-report.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          EXPECTED='633f600f7ec0ac5cdcdcffb536ade4beec8312cc083487a225c8c308771fd8d3'
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Unexpected signing certificate digest: $ACTUAL"
            exit 1
          fi
          cp "$APK" simhub-agent-v0.1.5-release.apk
          sha256sum simhub-agent-v0.1.5-release.apk > simhub-agent-v0.1.5-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: simhub-agent-v0.1.5-release-signed
          path: |
            simhub-agent-v0.1.5-release.apk
            simhub-agent-v0.1.5-release.apk.sha256
            signing-report.txt

      - name: Upload signed APK to v0.1.5 release
        if: ${{ inputs.publish_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.1.5 simhub-agent-v0.1.5-release.apk simhub-agent-v0.1.5-release.apk.sha256 --clobber
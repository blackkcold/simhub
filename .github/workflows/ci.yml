name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: python3 -m pip install -r modem_agent/requirements.txt -r server/requirements.txt
      - run: PYTHONPATH=server python3 -m unittest -v server.test_v040 server.test_v050 server.test_pairing
      - run: PYTHONPATH=server python3 -m unittest -v server.test_passkeys_e2e server.test_hardening
      - run: python3 scripts/test_docs.py
      - run: python3 server/test_simhub.py
      - run: python3 server/test_surfaces.py
      - run: PYTHONPATH=server python3 server/test_migration.py
      - run: PYTHONPATH=server python3 server/test_maintenance.py
      - run: PYTHONPATH=modem_agent python3 modem_agent/test_modem_agent.py
      - run: node --check web/app.js && node --check web/i18n.js && node --check web/sw.js
      - run: node web/test_crypto_vector.mjs
      - run: node web/test_bootstrap_vector.mjs
      - name: Browser UI regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node web/test_ui.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: simhub-ui-screenshots
          path: ui-snapshots/*.png
      - run: python3 -m py_compile server/simhub_server.py server/passkeys.py scripts/setup.py scripts/gen_admin_token.py modem_agent/simhub_modem_agent.py
      - run: bash -n modem_agent/install.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
      - run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simhub-agent-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
